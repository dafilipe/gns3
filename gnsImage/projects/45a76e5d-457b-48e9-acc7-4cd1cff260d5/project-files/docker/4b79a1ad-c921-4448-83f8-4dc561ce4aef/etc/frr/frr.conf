frr version 10.7.1
frr defaults datacenter
hostname DatacenterRack
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip router isis CAMPUS
 isis passive
exit
!
interface swp1
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis passive
exit
!
interface swp5
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface swp6
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface swp10
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface swp11
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
router isis CAMPUS
 is-type level-2-only
 net 49.0000.0100.0825.5031.00
 log-adjacency-changes
exit
!
