frr version 10.7.1
frr defaults datacenter
hostname Distribution2
log syslog informational
service integrated-vtysh-config
!
ip route 10.8.2.0/23 blackhole
!
interface lo
 ip router isis CAMPUS
 isis passive
exit
!
interface swp7
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface swp8
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface swp9
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface swp10
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
router isis CAMPUS
 is-type level-2-only
 net 49.0001.0100.0825.5012.00
 redistribute ipv4 static level-2
 log-adjacency-changes
exit
!
