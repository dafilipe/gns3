frr version 10.7.1
frr defaults datacenter
hostname BorderRouter
log syslog informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 198.51.100.2
!
interface lo
 ip router isis CAMPUS
 isis passive
exit
!
interface swp1
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface swp2
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface swp3
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface swp4
 ip router isis CAMPUS
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
router isis CAMPUS
 is-type level-2-only
 net 49.0000.0100.0825.5021.00
 default-information originate ipv4 level-2 always
 log-adjacency-changes
exit
!
