frr version 10.7.1
frr defaults datacenter
hostname r2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip router isis CGR
 isis passive
exit
!
interface swp1
 ip router isis CGR
 isis network point-to-point
exit
!
interface swp2
 ip router isis CGR
 isis network point-to-point
exit
!
router isis CGR
 net 49.0002.0102.5500.3002.00
exit
!
